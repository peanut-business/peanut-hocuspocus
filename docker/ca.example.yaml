# Explicit private-CA option: docker compose -f compose.yaml -f docker/ca.example.yaml up -d
services:
  collaboration:
    environment:
      NODE_EXTRA_CA_CERTS: /run/peanut-hocuspocus/certs/ca.pem
      CA_SHA256: ${CA_SHA256:?请填写应用提供的 CA 文件摘要}
    volumes:
      - type: bind
        source: ./certs
        target: /run/peanut-hocuspocus/certs
        read_only: true
        bind: {create_host_path: false}
