name: ${COMPOSE_PROJECT_NAME:?请在 .env 中设置 Compose 项目名}

services:
  collaboration:
    image: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    user: "33:33"
    working_dir: /srv/peanut-hocuspocus
    command: [node, dist/src/main.js]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1m"]
    environment:
      COLLABORATION_PHP_ORIGIN: ${COLLABORATION_PHP_ORIGIN:?请设置应用 PHP HTTPS 地址}
      COLLABORATION_INSTANCE_ID: ${COLLABORATION_INSTANCE_ID:?请设置应用实例 ID}
      COLLABORATION_SERVICE_INSTANCE_ID: ${COLLABORATION_SERVICE_INSTANCE_ID:?请设置协作服务实例 ID}
      COLLABORATION_KEY_ID: ${COLLABORATION_KEY_ID:?请设置认证密钥编号}
      COLLABORATION_EDITION: ${COLLABORATION_EDITION:?请设置应用版本类型}
      COLLABORATION_CA_SHA256: ${COLLABORATION_CA_SHA256:?请设置 CA 文件摘要}
      COLLABORATION_PHP_TIMEOUT_MS: "20000"
      COLLABORATION_LISTEN_ADDRESS: 0.0.0.0
      COLLABORATION_LISTEN_PORT: "80"
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:?请设置服务间认证密钥}
      NODE_EXTRA_CA_CERTS: /run/peanut-collaboration/ca.pem
    volumes:
      - type: bind
        source: ..
        target: /srv/peanut-hocuspocus
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../certs
        target: /run/peanut-collaboration
        read_only: true
        bind:
          create_host_path: false
    networks:
      service:
        aliases: [collaboration]
    # 左侧为宿主机端口；容器内固定使用锁定版本 Hocuspocus 的默认端口 80。
    ports:
      - "${COLLABORATION_PORT:?请设置宿主机对外端口}:80"
    # 仅在本容器网络命名空间中允许 UID 33 监听端口 80，保留 cap_drop: ALL。
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    stop_grace_period: 1m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.COLLABORATION_LISTEN_PORT+'/live',{redirect:'error',credentials:'omit'}).then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 25s
      retries: 3

networks:
  service:
    external: true
    name: ${COLLABORATION_NETWORK:?请设置已有 Docker 网络名称}
