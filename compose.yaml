name: ${COMPOSE_PROJECT_NAME:?请在 .env 中设置 Compose 项目名}

services:
  collaboration:
    image: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    user: "33:33"
    working_dir: /srv/peanut-hocuspocus
    command: [node, dist/src/main.js]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1m"]
    environment:
      COLLABORATION_PHP_ORIGIN: ${COLLABORATION_PHP_ORIGIN:?请设置应用 PHP HTTPS 地址}
      COLLABORATION_INSTANCE_ID: ${COLLABORATION_INSTANCE_ID:?请设置应用实例 ID}
      COLLABORATION_SERVICE_INSTANCE_ID: ${COLLABORATION_SERVICE_INSTANCE_ID:?请设置协作服务实例 ID}
      COLLABORATION_KEY_ID: ${COLLABORATION_KEY_ID:?请设置认证密钥编号}
      COLLABORATION_EDITION: ${COLLABORATION_EDITION:?请设置应用版本类型}
      COLLABORATION_CONFIG_REVISION: ${COLLABORATION_CONFIG_REVISION:?请设置配置修订号}
      COLLABORATION_CONFIG_SHA256: ${COLLABORATION_CONFIG_SHA256:?请设置配置摘要}
      COLLABORATION_CA_SHA256: ${COLLABORATION_CA_SHA256:?请设置 CA 文件摘要}
      COLLABORATION_PHP_TIMEOUT_MS: ${COLLABORATION_PHP_TIMEOUT_MS:?请设置 PHP 请求超时毫秒数}
      COLLABORATION_LISTEN_ADDRESS: ${COLLABORATION_LISTEN_ADDRESS:?请设置容器内监听地址}
      COLLABORATION_LISTEN_PORT: ${COLLABORATION_LISTEN_PORT:?请设置容器内监听端口}
      COLLABORATION_SECRET_FILE: /run/peanut-collaboration/service-secret
      NODE_EXTRA_CA_CERTS: /run/peanut-collaboration/ca.pem
    volumes:
      - type: bind
        source: .
        target: /srv/peanut-hocuspocus
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./private/collaboration/service
        target: /run/peanut-collaboration
        read_only: true
        bind:
          create_host_path: false
    networks:
      service:
        aliases: [collaboration]
    stop_grace_period: 1m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.COLLABORATION_LISTEN_PORT+'/ready',{redirect:'error',credentials:'omit'}).then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 25s
      retries: 3

networks:
  service:
    external: true
    name: ${COLLABORATION_NETWORK:?请设置已有 Docker 网络名称}
